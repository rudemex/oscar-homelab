  - id: oscar-led-controller
    kind: app
    status: current
    criticality: C4
    target: k3s01 (namespace oscar-lab)
    note: "identidad visual de OSCAR (tira WLED) — primer servicio migrado de Docker Compose (core01) a k3s/Argo CD; antes vivía en core01, ya retirado de ahí. LAN: led.oscar.home (DNS interno via AdGuard) -> Ingress (Traefik). Internet: https://led.oscarlab.com.ar vía Cloudflare Tunnel -> Traefik (Host header override) + Cloudflare Access (solo mdelgado) — la API no tiene auth propia y tiene endpoints de escritura (POST /state/:state)"
  - id: hermes
    kind: platform
    status: current
    criticality: C2
    target: k3s01 (namespace oscar-ai)
    note: "Hermes Agent + Open WebUI; LAN http://ai.oscar.home vía Traefik, sin Cloudflare; Anthropic API; secretos aislados en proyecto Hermes de Infisical; solo consulta Prometheus/SearXNG; health monitor por Prometheus Blackbox"
  - id: hermes-docs
    kind: platform
    status: current
    criticality: C4
    target: services (LXC 108, Docker Compose)
    note: "visor estático de la documentación de Hermes (README del chart, docs/ia/hermes.md, spec) — nginx:1.27-alpine sirviendo markdown renderizado client-side (marked.js vendorizado, sin CDN); LAN http://hermes-docs.oscar.home vía NPM (-> 192.168.0.154:8085); rewrite de AdGuard creado por el propio Hermes Agent (oscar_adguard_add_rewrite), no a mano; solo LAN, sin Cloudflare"
  - id: oscar-idp
    kind: platform
    status: current
    criticality: C3
    target: services (LXC 108, Docker Compose)
    note: "Backstage (catálogo/portal real de OSCAR) — repo propio git.oscar.home/platform/oscar-idp; backend Node single-container + Postgres (oscar-idp-db), catálogo generado desde este mismo inventory/services.yaml vía scripts/generate-catalog.py (no es sync en vivo, hay que correrlo y commitear a mano cuando cambie el inventario); auth guest (dangerouslyAllowOutsideDevelopment, sin sistema de identidad real todavía — fase 1); LAN http://idp.oscar.home vía NPM (-> 192.168.0.154:8086); imagen no está en Nexus (bloqueado insecure-registries), se transfiere a mano por SSH (docker save | ssh ... docker load); Scaffolder real con publish:gitea (integrations.gitea contra git.oscar.home, HTTP), primer template 'nestjs-service' publica en la org 'projects' de Forgejo a partir del mirror templates/nestjs-starter"
  - id: ai-operator
    kind: app
    status: future
    criticality: C4
    target: hybrid

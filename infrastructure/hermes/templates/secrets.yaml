{{- if .Values.enabled }}
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: hermes-secrets
spec:
  hostAPI: http://infisical.oscar.home/api
  syncConfig:
    resyncInterval: 60s
  authentication:
    universalAuth:
      credentialsRef:
        secretName: {{ .Values.secrets.credentialsSecret }}
        secretNamespace: {{ .Release.Namespace }}
      secretsScope:
        projectId: {{ .Values.secrets.projectId }}
        envSlug: {{ .Values.secrets.environment }}
        secretsPath: {{ .Values.secrets.path }}
  managedKubeSecretReferences:
    - secretName: hermes-runtime
      secretNamespace: {{ .Release.Namespace }}
      creationPolicy: Orphan
      secretType: Opaque
      template:
        data:
          API_SERVER_KEY: {{ "{{ .API_SERVER_KEY.Value }}" | quote }}
          {{ required "secrets.providerKeyEnv is required" .Values.secrets.providerKeyEnv }}: {{ "{{ .MODEL_API_KEY.Value }}" | quote }}
          {{- if .Values.proxmox.enabled }}
          OSCAR_PROXMOX_TOKEN_ID: {{ "{{ .OSCAR_PROXMOX_TOKEN_ID.Value }}" | quote }}
          OSCAR_PROXMOX_TOKEN_SECRET: {{ "{{ .OSCAR_PROXMOX_TOKEN_SECRET.Value }}" | quote }}
          OSCAR_PROXMOX_CA_PEM_BASE64: {{ "{{ .OSCAR_PROXMOX_CA_PEM_BASE64.Value }}" | quote }}
          {{- end }}
          {{- if .Values.homeAssistant.enabled }}
          OSCAR_HOME_ASSISTANT_TOKEN: {{ "{{ .OSCAR_HOME_ASSISTANT_TOKEN.Value }}" | quote }}
          {{- end }}
          {{- if .Values.forgejo.enabled }}
          HERMES_FORGEJO_TOKEN: {{ "{{ .HERMES_FORGEJO_TOKEN.Value }}" | quote }}
          {{- end }}
          {{- if .Values.adguard.enabled }}
          OSCAR_ADGUARD_USER: {{ "{{ .OSCAR_ADGUARD_USER.Value }}" | quote }}
          OSCAR_ADGUARD_PASSWORD: {{ "{{ .OSCAR_ADGUARD_PASSWORD.Value }}" | quote }}
          {{- end }}
          {{- if .Values.n8n.enabled }}
          OSCAR_N8N_API_KEY: {{ "{{ .OSCAR_N8N_API_KEY.Value }}" | quote }}
          {{- end }}
          {{- if .Values.proxmenux.enabled }}
          OSCAR_PROXMENUX_TOKEN: {{ "{{ .OSCAR_PROXMENUX_TOKEN.Value }}" | quote }}
          {{- end }}
          {{- if .Values.paperless.enabled }}
          OSCAR_PAPERLESS_TOKEN: {{ "{{ .OSCAR_PAPERLESS_TOKEN.Value }}" | quote }}
          {{- end }}
          {{- if .Values.dockerOperator.enabled }}
          OSCAR_DOCKER_OPERATOR_TOKEN_CORE: {{ "{{ .OSCAR_DOCKER_OPERATOR_TOKEN_CORE.Value }}" | quote }}
          OSCAR_DOCKER_OPERATOR_TOKEN_DEVOPS: {{ "{{ .OSCAR_DOCKER_OPERATOR_TOKEN_DEVOPS.Value }}" | quote }}
          OSCAR_DOCKER_OPERATOR_TOKEN_AUTOMATION: {{ "{{ .OSCAR_DOCKER_OPERATOR_TOKEN_AUTOMATION.Value }}" | quote }}
          OSCAR_DOCKER_OPERATOR_TOKEN_MONITOR: {{ "{{ .OSCAR_DOCKER_OPERATOR_TOKEN_MONITOR.Value }}" | quote }}
          OSCAR_DOCKER_OPERATOR_TOKEN_NETWORK: {{ "{{ .OSCAR_DOCKER_OPERATOR_TOKEN_NETWORK.Value }}" | quote }}
          {{- end }}
          {{- if .Values.discord.enabled }}
          DISCORD_BOT_TOKEN: {{ "{{ .DISCORD_BOT_TOKEN.Value }}" | quote }}
          DISCORD_ALLOWED_USERS: {{ "{{ .DISCORD_ALLOWED_USERS.Value }}" | quote }}
          {{- end }}
    - secretName: hermes-webui
      secretNamespace: {{ .Release.Namespace }}
      creationPolicy: Orphan
      secretType: Opaque
      template:
        data:
          OPENAI_API_KEY: {{ "{{ .API_SERVER_KEY.Value }}" | quote }}
          WEBUI_SECRET_KEY: {{ "{{ .WEBUI_SECRET_KEY.Value }}" | quote }}
          WEBUI_ADMIN_PASSWORD: {{ "{{ .WEBUI_ADMIN_PASSWORD.Value }}" | quote }}
{{- end }}

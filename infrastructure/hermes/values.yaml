# Piloto autorizado, clave administrada en Infisical /hermes.
enabled: true
nodeSelector:
  kubernetes.io/hostname: k3s01
model:
  provider: anthropic
  name: claude-sonnet-5-5
  baseUrl: https://api.anthropic.com
hermes:
  image: nousresearch/hermes-agent@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
  storage: 5Gi
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1536Mi}
webui:
  image: ghcr.io/open-webui/open-webui@sha256:0487ad4a5a4b986062dedace806c3ef1e88fec38c10d1e64d6a5501c66671e5e
  storage: 5Gi
  adminEmail: mdelgado@tresdoce.com.ar
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: "1", memory: 1536Mi}
  # Acceso solo LAN mediante Traefik; sin rutas de Cloudflare.
  ingress:
    enabled: true
    host: ai.oscar.home
secrets:
  projectId: 3ff70b49-4ae2-4cb7-9f0e-2465925f8d6a
  environment: prod
  path: /
  # Identidad Viewer limitada al proyecto Hermes, que solo contiene secretos de Hermes.
  credentialsSecret: hermes-infisical-auth
  providerKeyEnv: ANTHROPIC_API_KEY
discord:
  # Dedicated bot token and owner allowlist are stored in Infisical.
  enabled: true
proxmox:
  # Dedicated HermesOperator API token and public CA are stored in Infisical.
  enabled: true
  # Infraestructura: Hermes no puede borrarlas ni redimensionarlas (además, en Proxmox el token
  # tiene en esas VMs el rol HermesOperatorProtected, sin VM.Allocate ni VM.Config.*).
  protectedVmids: "102,103,104,106,107,108,109,110,9000"
homeAssistant:
  enabled: true
  api: http://192.168.0.195:80
forgejo:
  enabled: true
dockerOperator:
  # Five scoped HTTPS operators are installed; tokens live in Infisical.
  # The public CA certificate is versioned with the chart.
  enabled: true
adguard:
  # Dedicated restricted AdGuard Home user (HTTP Basic Auth); credentials in Infisical.
  # Not yet tested against the real instance -- verify the auth method before relying on it.
  enabled: true
kuma:
  # Read-only public status page, no credentials. Pause/resume/create monitor is not
  # implemented: Kuma has no stable REST API for mutations, only socket.io.
  enabled: true
n8n:
  # Dedicated n8n API key (X-N8N-API-KEY) in Infisical; LAN-only, same host as the
  # Discord Notification Broker. List/activate/deactivate workflows only.
  enabled: true
led:
  enabled: true
  api: http://oscar-led-controller.oscar-lab.svc.cluster.local:8080
proxmenux:
  # ProxMenux Monitor on oscar-core: disk SMART/temperature/alerts. Read-only API token in
  # Infisical as OSCAR_PROXMENUX_TOKEN.
  enabled: true
  api: http://192.168.0.233:8008
paperless:
  # Dedicated, limited Paperless-ngx user "hermes": add/view/edit documents and manage folders
  # (storage paths), tags, document types and correspondents; cannot delete documents or
  # administer). Its API token lives in Infisical as OSCAR_PAPERLESS_TOKEN. Documents the owner
  # sends through Discord are uploaded from the gateway's document cache.
  enabled: true
  api: http://192.168.0.154:8000
